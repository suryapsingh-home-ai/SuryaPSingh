<nav class="navbar">
  <div class="nav-inner">
    <a routerLink="/" class="logo">
      <span class="logo-badge">Angular</span>
      <span class="logo-text">Demo<strong>Shop</strong></span>
    </a>
    <div class="nav-spacer"></div>
    <button type="button" class="cart-btn" (click)="cartOpen = !cartOpen">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1" />
        <circle cx="20" cy="21" r="1" />
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
      </svg>
      <span *ngIf="cartCount > 0" class="cart-count">{{ cartCount }}</span>
      <span class="cart-label">Cart</span>
    </button>
  </div>
</nav>

<div class="page-wrap">
  <div class="content-area">
    <section class="catalog product-detail-wrap">
      <p *ngIf="loading" class="muted center">Loading product…</p>
      <p *ngIf="!loading && error" class="err center">{{ error }}</p>
      <div *ngIf="!loading && product" class="product-detail">
        <a routerLink="/" class="back-link">← Back to shop</a>
        <div class="product-detail-grid">
          <div class="product-detail-media">
            <img
              *ngIf="product.image_url"
              [src]="product.image_url"
              [alt]="product.name"
            />
            <div *ngIf="!product.image_url" class="ph detail-ph"></div>
          </div>
          <div class="product-detail-info">
            <span *ngIf="product.category" class="detail-category">{{ product.category.name }}</span>
            <h1 class="product-detail-title">{{ product.name }}</h1>
            <p class="product-detail-desc">{{ product.description }}</p>
            <div class="star-row">
              <span class="stars">★★★★☆</span>
              <span class="review-count">({{ product.stock }} in stock)</span>
            </div>
            <p class="product-detail-price">${{ (+product.price).toFixed(2) }}</p>
            <button type="button" class="add-btn detail-add" (click)="addToCart(product)">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </section>

    <app-cart-panel [(panelOpen)]="cartOpen"></app-cart-panel>
  </div>
</div>
