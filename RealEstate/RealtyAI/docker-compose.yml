version: '3.9'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/code
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: 'True'
      DJANGO_SECRET_KEY: 'replace-this-secret-key'
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    depends_on:
      - db

volumes:
  postgres_data:
